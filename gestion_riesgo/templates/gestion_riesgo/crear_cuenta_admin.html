<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Admin</title>
    <style>
        :root {
            --bg: #0f0f12;
            --bg-card: #18181f;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 420px; padding: 20px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; }
        input:focus { outline: none; border-color: var(--primary); }
        .checkbox { display: flex; align-items: center; gap: 8px; margin: 16px 0; }
        .checkbox input { width: auto; }
        .checkbox label { margin: 0; color: var(--text); }
        .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
        .success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: var(--success); padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Crear Cuenta</h1>
            <p class="subtitle">Solo administradores pueden crear nuevas cuentas</p>
            
            <div id="errorMsg" class="error"></div>
            <div id="successMsg" class="success"></div>
            
            <form id="createForm">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" name="username" required minlength="3" placeholder=" nombre de usuario">
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder=" correo@ejemplo.com">
                </div>
                
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" required minlength="8" placeholder=" minimo 8 caracteres">
                </div>
                
                <div class="checkbox">
                    <input type="checkbox" name="es_superuser" id="es_superuser">
                    <label for="es_superuser">Superadministrador (acceso total)</label>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">Crear Cuenta</button>
            </form>
        </div>
    </div>
    
    <script>
        document.getElementById('createForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const error = document.getElementById('errorMsg');
            const success = document.getElementById('successMsg');
            
            btn.disabled = true;
            btn.textContent = 'Creando...';
            error.style.display = 'none';
            success.style.display = 'none';
            
            const formData = new FormData(this);
            
            try {
                const response = await fetch('/admin/api/crear-cuenta/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(Object.fromEntries(formData)),
                    credentials: 'same-origin'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    success.textContent = data.message;
                    success.style.display = 'block';
                    this.reset();
                } else {
                    error.textContent = data.error || 'Error al crear cuenta';
                    error.style.display = 'block';
                }
            } catch (err) {
                error.textContent = 'Error de conexión';
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Crear Cuenta';
            }
        });
    </script>
</body>
</html>
